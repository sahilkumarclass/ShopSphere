spring:
  application:
    name: AUTH-SERVICE
  config:
    import: ""
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWVub3VnaA==
  expiration: 3600000

management:
  tracing:
    enabled: false
